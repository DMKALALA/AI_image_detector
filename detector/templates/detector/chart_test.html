<!DOCTYPE html>
<html>
<head>
    <title>ECharts Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .chart-container {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #testChart {
            width: 100%;
            height: 400px;
            border: 1px solid #ddd;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>ECharts Diagnostic Test</h1>
    
    <div id="status"></div>
    
    <div class="chart-container">
        <h2>Test Chart</h2>
        <div id="testChart"></div>
    </div>
    
    <div class="chart-container">
        <h2>Console Output</h2>
        <pre id="console"></pre>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script>
        // Console capture
        const consoleOutput = document.getElementById('console');
        const originalLog = console.log;
        const originalError = console.error;
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            consoleOutput.textContent += args.join(' ') + '\n';
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            consoleOutput.textContent += 'ERROR: ' + args.join(' ') + '\n';
        };
        
        // Status function
        function showStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.className = 'status ' + (isError ? 'error' : 'success');
            status.textContent = message;
        }
        
        // Test ECharts
        console.log('Starting ECharts test...');
        console.log('ECharts version:', typeof echarts !== 'undefined' ? echarts.version : 'NOT LOADED');
        
        if (typeof echarts === 'undefined') {
            showStatus('ERROR: ECharts library not loaded!', true);
            console.error('echarts is undefined');
        } else {
            showStatus('✓ ECharts library loaded successfully!');
            console.log('ECharts object:', echarts);
            
            try {
                // Initialize chart
                const chartDom = document.getElementById('testChart');
                console.log('Chart container:', chartDom);
                console.log('Container dimensions:', chartDom.offsetWidth, 'x', chartDom.offsetHeight);
                
                const myChart = echarts.init(chartDom);
                console.log('Chart initialized:', myChart);
                
                // Simple test chart
                const option = {
                    title: {
                        text: 'Test Chart - If you see this, ECharts works!'
                    },
                    tooltip: {},
                    xAxis: {
                        data: ['A', 'B', 'C', 'D', 'E']
                    },
                    yAxis: {},
                    series: [{
                        name: 'Sales',
                        type: 'bar',
                        data: [5, 20, 36, 10, 10],
                        itemStyle: {
                            color: '#4285F4'
                        }
                    }]
                };
                
                myChart.setOption(option);
                console.log('Chart option set successfully!');
                showStatus('✓ Chart rendered successfully! ECharts is working.');
                
            } catch(e) {
                showStatus('ERROR: ' + e.message, true);
                console.error('Chart initialization error:', e);
            }
        }
    </script>
</body>
</html>
